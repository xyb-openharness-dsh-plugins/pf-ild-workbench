<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小呼宝 BreathPal · PF-ILD 工作台</title>
<meta name="robots" content="noindex,nofollow">
<!-- 内联 favicon：原型是 file:// 或单目录静态托管，不给 favicon.ico 会在控制台留一条 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b6cb0'/%3E%3Ctext x='16' y='23' font-size='18' font-family='PingFang SC,Helvetica,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E5%91%BC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="prototype-bar"><span><b>__VERSION_DISPLAY__</b> · 全部为模拟资料（临床试验为占位，待 M4 检索填充）</span><span>本机数据 · 不上传 · AI 面板由宿主提供</span></div>
<div class="workspace">
  <aside class="sidebar" aria-label="小呼宝业务导航">
    <div class="brand no-mark"><div><strong>小呼宝</strong><span>BreathPal · 趋势先记清</span></div></div>
    <button class="profile profile-btn" id="profile-btn" data-action="profiles" aria-label="切换演示档案，当前为王秀兰">
      <div class="avatar" id="profile-avatar" aria-hidden="true">王</div>
      <div><b id="profile-name">王秀兰的资料</b><span id="profile-meta">62 岁 · 纤维化型过敏性肺炎</span></div>
      <span class="profile-caret" aria-hidden="true">⌄</span>
    </button>
    <nav id="nav" aria-label="一级导航"></nav>
    <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>肺功能掉多少要有人陪着看，<br>移植评估的窗口不能靠猜。</p><button class="text-button" data-action="help">原型操作说明 ↗</button></div>
  </aside>
  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小呼宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
      <div class="top-actions">
        <button class="status" id="ready-store" data-action="open-store" aria-label="资料目录：未指定"><i class="grey"></i><span>资料目录</span><b id="store-state">未指定</b></button>
        <button class="status" id="agent-toggle" data-action="agent" aria-expanded="false" aria-label="AI 对话：点击打开右侧原生会话面板"><i class="grey"></i><span>AI 对话</span><b id="agent-state">未进入激活</b></button>
        <button data-action="settings" aria-label="打开设置：资料目录、文档解析、临床数据库">设置</button>
        <button id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
        <button class="ver-chip" id="ver-chip" data-action="about" aria-label="关于小呼宝：查看版本号与构建信息">v0.1.0</button>
      </div>
    </header>
    <div class="work-grid" id="work-grid">
      <main id="main" tabindex="-1"></main>
      <aside class="agent-dock" id="agent-dock" aria-label="AI 原生会话面板" hidden>
        <div class="agent-head">
          <span class="dot" id="agent-dot"></span><b>AI 对话</b>
          <div class="spacer"></div>
          <div class="agent-sizes" role="group" aria-label="面板宽度">
            <button data-action="agent-size" data-size="narrow" aria-pressed="false" title="窄">窄</button>
            <button data-action="agent-size" data-size="std" aria-pressed="true" title="标准">标准</button>
            <button data-action="agent-size" data-size="wide" aria-pressed="false" title="宽">宽</button>
          </div>
          <button class="icon-button" data-action="agent" aria-label="隐藏 AI 对话面板" title="隐藏">×</button>
        </div>
        <div class="agent-body" id="agent-body"></div>
        <div class="agent-foot">
          <button class="primary" data-action="agent-build">整理本页要点</button>
          <button data-action="agent-demo">模拟回复自检</button>
        </div>
      </aside>
    </div>
    <footer class="footer">小呼宝 · 与 PF-ILD 患者和照护者一起整理、理解、准备沟通 <span class="ver-line"><b id="app-version">v0.1.0</b><em id="app-build">2026-10-25</em></span></footer>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><div><span class="eyebrow" id="dialog-eyebrow">小呼宝</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-action="close" aria-label="关闭弹窗">×</button></div>
  <div id="dialog-body" class="dialog-body"></div>
  <div id="dialog-foot" class="dialog-foot"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body></html>
